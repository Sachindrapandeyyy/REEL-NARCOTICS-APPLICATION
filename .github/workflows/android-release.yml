name: Android Release & Update Publication

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v2.3.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Sign, and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Restore Signing Keystore from Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from GitHub Secret..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > zenith-release.keystore
          elif [ -f "zenith-release.keystore" ]; then
            echo "Using local repository keystore..."
          else
            echo "Warning: Keystore not found; release build will fail if signing is required."
          fi

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest

      - name: Assemble Signed Release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: zenith-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Install CI Dependencies
        run: |
          cd ci
          npm install
          cd ..

      - name: Package Release & Publish to Vercel Blob
        id: release_packager
        run: node ci/publish-release.mjs --release
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: Reel Narcotics v${{ steps.release_packager.outputs.versionName }}
          tag_name: ${{ github.ref_name }}
          files: |
            build/release-dist/*.apk
            build/release-dist/update.json
          generate_release_notes: true
          draft: false
          prerelease: false
